[package]
name = "update-kit-cli"
version = "0.1.12"
edition = "2021"
description = "CLI interface for update-kit, a channel-aware self-update toolkit"
license = "MIT"
repository = "https://github.com/syi0808/update-kit"

[dependencies]
serde_json = "1"

[dependencies.update-kit]
path = "../update-kit"
version = "0.1.12"

[dependencies.clap]
version = "4"
features = [ "derive" ]

[dependencies.tokio]
version = "1"
features = [ "full" ]
