[package]
name = "update-kit"
version = "0.1.7"
edition = "2021"
description = "Channel-aware self-update toolkit for CLI applications"
license = "MIT"

[dependencies]
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = "2"
dirs = "6"
async-trait = "0.1"
regex = "1"
futures-util = "0.3"
tempfile = "3"
libc = "0.2.182"

[dependencies.tokio]
version = "1"
features = [ "full" ]

[dependencies.reqwest]
version = "0.12"
features = [ "json", "stream" ]

[dependencies.semver]
version = "1"
features = [ "serde" ]

[dependencies.serde]
version = "1"
features = [ "derive" ]

[dev-dependencies]
mockito = "1"
tempfile = "3"

[dev-dependencies.tokio]
version = "1"
features = [ "test-util" ]
